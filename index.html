<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI × HUMAN INTERFACE ATLAS 300</title><style>html,body{margin:0;background:#080b12;color:#f4f7fb;font-family:system-ui,sans-serif}#status{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.dot{display:inline-block;animation:b 1s infinite alternate}@keyframes b{to{opacity:.25}}pre{white-space:pre-wrap;max-width:760px}</style></head><body><div id="status"><div>AI × HUMAN INTERFACE ATLAS 300<br><span class="dot">読み込み中…</span></div></div><script>(async()=>{try{const names=["p00","p01","p02","q00","q01","q02","q03","q04","q05","q06","q07","q08","q09","q10"],parts=[];for(const n of names){const u=`https://raw.githubusercontent.com/137yugi/ai-human-interface-atlas/main/parts/${n}.txt?v=4`;const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(`${n}: ${r.status}`);parts.push((await r.text()).trim())}const b=atob(parts.join("")),u8=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u8[i]=b.charCodeAt(i);const ds=new DecompressionStream("gzip"),html=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById("status").innerHTML=`<pre>読み込みに失敗しました\n${String(e)}</pre>`}})();</script></body></html>
